<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kotoba — Citations de mangas & animés</title>
<meta name="description" content="Les répliques qui marquent, en mangas et animés. Trouve, sauvegarde, partage.">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<nav class="nav">
  <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <a href="./" class="nav-logo">Kotoba<span class="nav-logo-jp">言葉</span></a>
  <div class="nav-links" id="navLinks">
    <button class="nav-link" data-goto="parcourir">Parcourir</button>
    <button class="nav-link" data-goto="favoris">Favoris</button>
    <button class="btn-primary btn-sm" id="submitBtn">Proposer</button>
  </div>
</nav>

<!-- ============ HERO — citation du jour ============ -->
<header class="hero">
  <p class="eyebrow">Citation du jour</p>
  <div class="quote-day">
    <span class="bracket bracket-open">「</span>
    <p class="quote-day-text" id="quoteDayText">Chargement...</p>
    <span class="bracket bracket-close">」</span>
  </div>
  <p class="quote-day-meta" id="quoteDayMeta"></p>
  <div class="hero-actions">
    <button class="btn-secondary btn-sm" id="cardDayBtn">Créer une carte</button>
    <button class="btn-secondary btn-sm" id="randomBtn">🎲 Citation aléatoire</button>
  </div>
  <p class="quote-count" id="quoteCount"></p>
</header>

<!-- ============ CATÉGORIES ============ -->
<section class="section" id="parcourir">
  <div class="category-row" id="categoryRow">
    <button class="chip is-active" data-cat="Toutes">Toutes</button>
    <button class="chip" data-cat="Motivation">Motivation</button>
    <button class="chip" data-cat="Amitié">Amitié</button>
    <button class="chip" data-cat="Amour">Amour</button>
    <button class="chip" data-cat="Force">Force</button>
    <button class="chip" data-cat="Perte">Perte</button>
  </div>

  <div class="category-row" id="langRow">
    <button class="chip is-active" data-lang="Toutes">Toutes langues</button>
    <button class="chip" data-lang="Français">Français</button>
    <button class="chip" data-lang="English">English</button>
    <button class="chip" data-lang="日本語">日本語</button>
  </div>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Chercher une série, un personnage...">
  </div>

  <div class="quote-grid" id="quoteGrid"></div>
</section>

<!-- ============ FAVORIS ============ -->
<section class="section" id="favoris" hidden>
  <h2 class="section-title">Tes favoris</h2>
  <div class="quote-grid" id="favGrid"></div>
  <p class="empty-hint" id="favEmpty" hidden>Aucun favori pour l'instant — clique le ♡ sur une citation.</p>
</section>

<!-- ============ MODALE : PROPOSER UNE CITATION ============ -->
<div class="modal-overlay" id="submitModal">
  <div class="modal">
    <button class="modal-close" id="submitModalClose">✕</button>
    <h2 class="modal-title">Proposer une citation</h2>
    <p class="modal-subtitle">Elle sera vérifiée avant de rejoindre le site.</p>

    <form id="submitForm" class="submit-form">
      <textarea id="subText" rows="3" maxlength="280" placeholder="La citation exacte..." required></textarea>
      <input type="text" id="subCharacter" placeholder="Personnage" required>
      <input type="text" id="subSeries" placeholder="Série (ex: One Piece)" required>
      <select id="subCategory">
        <option value="Motivation">Motivation</option>
        <option value="Amitié">Amitié</option>
        <option value="Amour">Amour</option>
        <option value="Force">Force</option>
        <option value="Perte">Perte</option>
      </select>
      <select id="subLang">
        <option value="Français">Français</option>
        <option value="English">English</option>
        <option value="日本語">日本語</option>
        <option value="Autre">Autre</option>
      </select>
      <button type="submit" class="btn-primary">Envoyer</button>
      <p class="form-status" id="submitStatus"></p>
    </form>
  </div>
</div>

<!-- ============ MODALE : CARTE DE CITATION (génération image) ============ -->
<div class="modal-overlay" id="cardModal">
  <div class="modal modal-card">
    <button class="modal-close" id="cardModalClose">✕</button>
    <canvas id="quoteCanvas" width="1000" height="1000"></canvas>
    <button class="btn-primary" id="downloadCardBtn">Télécharger l'image</button>
  </div>
</div>

<footer class="footer">
  <p>Kotoba — Concept par Babacar Diouf</p>
  <a href="https://ko-fi.com/babacardiouf" target="_blank" rel="noopener" class="kofi-link">☕ Soutenir Kotoba</a>
</footer>

<script src="app.js?v=5"></script>
<script type="module" src="kotoba.js?v=5"></script>
</body>
</html>
